<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=3,user-scalable=yes" />
<link id="hljs-theme" rel="stylesheet" href="hljs-dark.css" />
<style>
  :root {
    --bg: #000000;
    --gutter-bg: #111113;
    --gutter-fg: #636366;
    --fg: #F2F2F7;
    --border: #2C2C2E;
    --hi-line: rgba(10, 132, 255, 0.22);
    --mark-bg: rgba(255, 214, 10, 0.42);
  }
  body.light {
    --bg: #FFFFFF;
    --gutter-bg: #F2F2F7;
    --gutter-fg: #8E8E93;
    --fg: #1C1C1E;
    --border: #E5E5EA;
    --hi-line: rgba(0, 122, 255, 0.14);
    --mark-bg: rgba(255, 204, 0, 0.50);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px; line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }
  #wrap {
    width: 100%; overflow-x: auto;
    padding: 8px 0 36px 0;
  }
  table.code {
    border-collapse: collapse;
    min-width: 100%;
    table-layout: auto;
  }
  table.code.wrap-lines td.lc {
    white-space: pre-wrap;
    word-break: break-all;
  }
  td.ln {
    user-select: none;
    -webkit-user-select: none;
    text-align: right;
    vertical-align: top;
    padding: 0 10px 0 12px;
    color: var(--gutter-fg);
    background: var(--gutter-bg);
    border-right: 1px solid var(--border);
    position: sticky;
    left: 0;
    min-width: 44px;
  }
  td.lc {
    padding: 0 14px 0 12px;
    white-space: pre;
    tab-size: 4;
    vertical-align: top;
  }
  tr.hl td { background: var(--hi-line); }
  mark { background: var(--mark-bg); color: inherit; border-radius: 2px; padding: 0 1px; }
  .hljs { background: transparent !important; padding: 0 !important; }
</style>
<script src="highlight.min.js"></script>
</head>
<body>
<div id="wrap"><table class="code" id="tbl"></table></div>
<script>
let rawText = '';
let startLine = 1;
let currentExt = '';
let wrapEnabled = false;
let highlightLineNum = 0;

function setTheme(isDark) {
  document.body.classList.toggle('light', !isDark);
  document.getElementById('hljs-theme').href = isDark ? 'hljs-dark.css' : 'hljs-light.css';
}

function setWrap(on) {
  wrapEnabled = !!on;
  document.getElementById('tbl').classList.toggle('wrap-lines', wrapEnabled);
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function mapExt(ext) {
  const m = {
    '.kt':'kotlin', '.kts':'kotlin', '.go':'go', '.py':'python', '.js':'javascript',
    '.mjs':'javascript', '.cjs':'javascript', '.jsx':'javascript', '.ts':'typescript',
    '.tsx':'typescript', '.java':'java', '.rs':'rust', '.c':'c', '.h':'c', '.cpp':'cpp',
    '.hpp':'cpp', '.swift':'swift', '.sh':'bash', '.zsh':'bash', '.bash':'bash',
    '.json':'json', '.yml':'yaml', '.yaml':'yaml', '.toml':'ini', '.xml':'xml',
    '.html':'xml', '.htm':'xml', '.css':'css', '.scss':'scss', '.sql':'sql',
    '.md':'markdown', '.rb':'ruby', '.php':'php', '.gradle':'groovy', '.ini':'ini',
    '.conf':'nginx', '.dockerfile':'dockerfile'
  };
  return m[(ext || '').toLowerCase()] || '';
}

function renderCode(text, ext, offsetLine, jumpLine, isDark) {
  setTheme(isDark);
  rawText = text || '';
  currentExt = ext || '';
  startLine = offsetLine || 1;
  highlightLineNum = jumpLine || 0;

  let highlighted = '';
  const lang = mapExt(currentExt);
  try {
    if (window.hljs && rawText.length < 300000) {
      if (lang && hljs.getLanguage(lang)) {
        highlighted = hljs.highlight(rawText, { language: lang, ignoreIllegals: true }).value;
      } else {
        highlighted = escapeHtml(rawText);
      }
    } else {
      highlighted = escapeHtml(rawText);
    }
  } catch (e) {
    highlighted = escapeHtml(rawText);
  }

  const lines = highlighted.split('\n');
  const tbl = document.getElementById('tbl');
  const chunks = [];
  for (let i = 0; i < lines.length; i++) {
    const ln = startLine + i;
    const cls = (ln === highlightLineNum) ? ' class="hl"' : '';
    chunks.push('<tr id="L' + ln + '"' + cls + '><td class="ln">' + ln + '</td><td class="lc hljs">' + (lines[i] || ' ') + '</td></tr>');
  }
  tbl.innerHTML = chunks.join('');
  if (highlightLineNum > 0) {
    const row = document.getElementById('L' + highlightLineNum);
    if (row) setTimeout(() => row.scrollIntoView({ behavior: 'smooth', block: 'center' }), 60);
  }
}

function searchInCode(query) {
  const q = (query || '').trim();
  const rows = document.querySelectorAll('#tbl tr');
  let first = null;
  let count = 0;
  const rawLines = rawText.split('\n');
  const ql = q.toLowerCase();
  for (let i = 0; i < rows.length; i++) {
    const ln = startLine + i;
    const line = rawLines[i] || '';
    const match = q && line.toLowerCase().includes(ql);
    rows[i].classList.toggle('hl', match || ln === highlightLineNum);
    if (match) {
      count++;
      if (!first) first = rows[i];
    }
  }
  if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
  return count;
}

function setFontSize(px) {
  document.body.style.fontSize = Math.max(10, Math.min(22, px)) + 'px';
}

window.renderCode = renderCode;
window.setTheme = setTheme;
window.setWrap = setWrap;
window.searchInCode = searchInCode;
window.setFontSize = setFontSize;
</script>
</body>
</html>
