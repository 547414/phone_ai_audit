# Phone AI Audit - macOS Terminal.app & mobile xterm.js compatible tmux config
# Keep Mac's native full window size (never shrink Mac window or draw dotted borders when phone attaches)
set -g default-terminal "xterm-256color"
set -g mouse on
set -g history-limit 20000
set -g set-clipboard on
set -g window-size largest
set -g focus-events on
set -g extended-keys off
set -g escape-time 10
set -g status-left-length 36
set -g status-style "bg=#1f2430,fg=#cbccc6"
set -g status-left " #[fg=#73d0ff]#S #[fg=#5c6773]| "
set -g status-right " #[fg=#bae67e]%H:%M "
