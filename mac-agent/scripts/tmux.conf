# Phone AI Audit - macOS Terminal.app & mobile xterm.js compatible tmux config
# Keep Mac's native full window size (never shrink Mac window or draw dotted borders when phone attaches)
set -g default-terminal "xterm-256color"
set -g mouse on
set -g history-limit 20000
set -g set-clipboard on
set -g window-size largest
set -g focus-events on
set -g extended-keys off
set -g escape-time 10
set -g display-time 1200

# macOS Terminal.app ignores OSC 52 (set-clipboard on); pipe directly to macOS clipboard (pbcopy) with UTF-8 locale
if-shell "test -x /usr/bin/pbcopy" "set -s copy-command 'LC_ALL=en_US.UTF-8 /usr/bin/pbcopy'"

# Mouse drag-release / double-click / triple-click / Enter / y -> copy straight to macOS clipboard
bind-key -T copy-mode    MouseDragEnd1Pane if-shell -F "#{selection_present}" { send-keys -X copy-pipe-and-cancel ; display-message "已复制到系统剪贴板" } { send-keys -X cancel }
bind-key -T copy-mode-vi MouseDragEnd1Pane if-shell -F "#{selection_present}" { send-keys -X copy-pipe-and-cancel ; display-message "已复制到系统剪贴板" } { send-keys -X cancel }

bind-key -T copy-mode    DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel \; display-message "已复制到系统剪贴板"
bind-key -T copy-mode    TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel \; display-message "已复制到系统剪贴板"
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel \; display-message "已复制到系统剪贴板"
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel \; display-message "已复制到系统剪贴板"

bind-key -T root DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel ; display-message "已复制到系统剪贴板" }
bind-key -T root TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-line ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel ; display-message "已复制到系统剪贴板" }

bind-key -T copy-mode    Enter if-shell -F "#{selection_present}" { send-keys -X copy-pipe-and-cancel ; display-message "已复制到系统剪贴板" } { send-keys -X cancel }
bind-key -T copy-mode    y     if-shell -F "#{selection_present}" { send-keys -X copy-pipe-and-cancel ; display-message "已复制到系统剪贴板" } { send-keys -X cancel }
bind-key -T copy-mode-vi Enter if-shell -F "#{selection_present}" { send-keys -X copy-pipe-and-cancel ; display-message "已复制到系统剪贴板" } { send-keys -X cancel }
bind-key -T copy-mode-vi y     if-shell -F "#{selection_present}" { send-keys -X copy-pipe-and-cancel ; display-message "已复制到系统剪贴板" } { send-keys -X cancel }

# Right-click context menu wired to macOS system clipboard (pbcopy / pbpaste)
bind-key -T root MouseDown3Pane if-shell -F -t = "#{||:#{mouse_any_flag},#{&&:#{pane_in_mode},#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}}}" { select-pane -t = ; send-keys -M } { display-menu -T "#[align=centre]快捷菜单" -t = -x M -y M \
  "#{?selection_present,复制选区 (系统剪贴板),}" c { send-keys -X -t = copy-pipe-and-cancel ; display-message "已复制到系统剪贴板" } \
  "#{?#{!:#{pane_in_mode}},粘贴 (系统剪贴板),}" p { select-pane -t = ; run-shell 'PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:$PATH"; LC_ALL=en_US.UTF-8 /usr/bin/pbpaste | tmux load-buffer - && tmux paste-buffer -p -d' } \
  "" \
  "#{?mouse_word,复制当前词: #{=/12/...:mouse_word},}" w { copy-mode -q ; set-buffer -- "#{q:mouse_word}" ; run-shell 'PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:$PATH"; tmux show-buffer | LC_ALL=en_US.UTF-8 /usr/bin/pbcopy' ; display-message "已复制到系统剪贴板" } \
  "#{?mouse_line,复制当前行,}" l { copy-mode -q ; set-buffer -- "#{q:mouse_line}" ; run-shell 'PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:$PATH"; tmux show-buffer | LC_ALL=en_US.UTF-8 /usr/bin/pbcopy' ; display-message "已复制到系统剪贴板" } \
  "" \
  "#{?pane_in_mode,退出滚动/复制模式,进入滚动/复制模式}" [ { if-shell -F -t = "#{pane_in_mode}" { copy-mode -q -t = } { copy-mode -t = } } \
  "#{?#{!:#{pane_floating_flag}},左右分屏,}" h { split-window -h -t = } \
  "#{?#{!:#{pane_floating_flag}},上下分屏,}" v { split-window -v -t = } }

# Status bar
set -g status-left-length 36
set -g status-style "bg=#1f2430,fg=#cbccc6"
set -g status-left " #[fg=#73d0ff]#S #[fg=#5c6773]| "
set -g status-right " #[fg=#bae67e]%H:%M "
